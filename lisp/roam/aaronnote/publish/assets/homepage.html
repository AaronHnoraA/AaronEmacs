<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aaron He</title>
  <link rel="shortcut icon"
    href="https://raw.githubusercontent.com/AaronHnoraA/AaronHnoraA.github.io/refs/heads/master/css/cv.svg"
    type="image/x-icon">
  <link rel="stylesheet" href="css/home-cli.css?v=20260610-cli5" />
  <link rel="stylesheet" href="css/mac-window.css?v=20260610-cli5" />
</head>

<body class="site-home home-cli">

  <!-- macOS terminal window -->
  <div class="terminal-window">

    <!-- Title bar -->
    <div class="terminal-chrome">
      <div class="window-controls">
        <span class="wc wc-close"></span>
        <span class="wc wc-min"></span>
        <span class="wc wc-max"></span>
      </div>
      <div class="window-title">hc@Aaron — homepage</div>
    </div>

    <!-- Scrollable body -->
    <div class="terminal-body">
      <div class="terminal-scroll" id="terminal-scroll">

        <!-- ── Static boot output ── -->
        <div class="terminal-static">

          <span class="t-line t-dim" data-login-time>login time: ... on ttys004</span>
          <span class="t-blank"></span>

          <!-- Neofetch box -->
          <div class="neofetch-block" id="neofetch-static">
            <!-- Populated by home-cli.js on DOMContentLoaded -->
          </div>

          <!-- Recent notes preview — rendered by home-cli.js -->
          <div class="recent-block" id="recent-static"></div>

          <!-- Fortune / cow — rendered by home-cli.js -->
          <div class="fortune-block" id="fortune-static"></div>

          <span class="t-blank"></span>
          <span class="t-line t-hint" id="terminal-hint" style="visibility:hidden">
Type <span class="t-cmd">help</span> for available commands. &nbsp;<span class="t-dim">notes · recent · about · graph · cv · github</span></span>
          <span class="t-blank"></span>
        </div>

        <!-- ── Dynamic command history ── -->
        <div class="terminal-history" id="terminal-history"></div>

        <!-- ── Input prompt ── -->
        <div class="prompt-area">
          <span class="prompt-ps1">
            <span class="p-user">hc</span><span class="p-at">@</span><span class="p-host">Aaron</span>
            <span class="p-sep"> </span><span class="p-path">~</span>
            <span class="p-sep"> </span><span class="p-sym">%</span>
          </span>
          <input
            type="text"
            id="terminal-input"
            class="terminal-input"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            autofocus
          />
        </div>
      </div><!-- /terminal-scroll -->
    </div><!-- /terminal-body -->
  </div><!-- /terminal-window -->

  <!-- Stone badge — fixed corner -->
  <a href="https://stone.professorlee.work"
     target="_blank"
     rel="noreferrer"
     style="position:fixed;bottom:14px;right:16px;opacity:0.7;transition:opacity .2s;z-index:10;"
     onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">
    <img src="https://stone.professorlee.work/api/stone/AaronHnoraA/AaronHnoraA.github.io"
         alt="Stone Badge"
         width="50" height="50"
         loading="lazy" />
  </a>

  <!-- Data & scripts -->
  <script src="js/data.js?v=20260610-cli6"></script>
  <script src="js/knowledge.js?v=20260610-cli6"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="js/graph.js?v=20260610-cli6"></script>
  <script src="js/mac-window.js?v=20260610-cli6"></script>
  <script src="js/home-cli.js?v=20260610-cli6"></script>
  <script src="js/oneko.js?v=20260610-cli6"></script>
</body>

</html>
