<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AaronNote Debug</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f2e7;
        --paper-soft: #efe6d5;
        --ink: #28231d;
        --muted: #6d6357;
        --line: #c9bda9;
        --red: #a12836;
        --green: #1e7352;
        --blue: #245e91;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      main {
        display: grid;
        grid-template-columns: minmax(280px, 1fr) minmax(360px, 1.25fr);
        min-height: 100vh;
      }

      section {
        min-width: 0;
        padding: 18px;
        border-bottom: 1px solid var(--line);
      }

      .left {
        border-right: 1px solid var(--line);
      }

      h1, h2 {
        margin: 0 0 12px;
        line-height: 1.2;
        font-weight: 640;
      }

      h1 { font-size: 20px; }
      h2 { font-size: 14px; }

      header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 12px;
      }

      button {
        border: 1px solid var(--line);
        background: var(--paper-soft);
        color: var(--ink);
        min-height: 30px;
        padding: 4px 10px;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: color-mix(in srgb, var(--paper-soft), white 36%);
      }

      .sample {
        margin: -7px 0 15px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      dl {
        display: grid;
        grid-template-columns: minmax(115px, max-content) minmax(0, 1fr);
        gap: 7px 12px;
        margin: 0;
      }

      dt { color: var(--muted); }
      dd {
        min-width: 0;
        margin: 0;
        overflow-wrap: anywhere;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
        table-layout: fixed;
      }

      th, td {
        min-width: 0;
        padding: 7px 6px;
        border-top: 1px solid color-mix(in srgb, var(--line), transparent 28%);
        text-align: left;
        vertical-align: top;
        overflow-wrap: anywhere;
      }

      th {
        border-top: 0;
        color: var(--muted);
        font-weight: 520;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .stack {
        display: grid;
        gap: 0;
      }

      .stack article {
        padding: 9px 0;
        border-top: 1px solid color-mix(in srgb, var(--line), transparent 28%);
      }

      .muted { color: var(--muted); }
      .running { color: var(--blue); }
      .done { color: var(--green); }
      .error, .failed { color: var(--red); }
      .warning, .returned-error { color: #8d5c08; }

      @media (max-width: 860px) {
        main { grid-template-columns: 1fr; }
        .left { border-right: 0; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="left">
        <section>
          <header>
            <h1>AaronNote Debug</h1>
            <button type="button" id="close" title="Close and unload debug monitoring">Close</button>
          </header>
          <p class="sample" id="sample">Waiting for sample</p>
          <dl id="runtime"></dl>
        </section>
        <section>
          <h2>Power</h2>
          <dl id="power"></dl>
        </section>
        <section>
          <h2>App Metrics</h2>
          <table>
            <thead>
              <tr><th>Process</th><th>PID</th><th>CPU</th><th>Memory</th></tr>
            </thead>
            <tbody id="metrics"></tbody>
          </table>
        </section>
        <section>
          <h2>Power Events</h2>
          <table>
            <thead>
              <tr><th>Time</th><th>Event</th><th>Detail</th></tr>
            </thead>
            <tbody id="power-events"></tbody>
          </table>
        </section>
      </div>
      <div>
        <section>
          <h2>Background Tasks</h2>
          <table>
            <thead>
              <tr><th>State</th><th>Task</th><th>Started</th><th>Duration</th></tr>
            </thead>
            <tbody id="tasks"></tbody>
          </table>
        </section>
        <section>
          <h2>Error And Warn Trace</h2>
          <div class="stack" id="logs"></div>
        </section>
      </div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);

      function time(at) {
        return at ? new Date(at).toLocaleTimeString() : "";
      }

      function duration(task, sampledAt) {
        const ms = (task.endedAt || sampledAt) - task.startedAt;
        return ms < 1000 ? `${ms} ms` : `${(ms / 1000).toFixed(2)} s`;
      }

      function cell(text, className = "") {
        const td = document.createElement("td");
        td.textContent = text;
        if (className) td.className = className;
        return td;
      }

      function rows(tbody, entries, render, empty) {
        tbody.replaceChildren();
        if (!entries.length) {
          const tr = document.createElement("tr");
          const td = cell(empty, "muted");
          td.colSpan = tbody.closest("table").querySelectorAll("th").length;
          tr.append(td);
          tbody.append(tr);
          return;
        }
        entries.forEach((entry) => tbody.append(render(entry)));
      }

      function pairs(root, entries) {
        root.replaceChildren();
        entries.forEach(([name, value]) => {
          const dt = document.createElement("dt");
          const dd = document.createElement("dd");
          dt.textContent = name;
          dd.textContent = value;
          root.append(dt, dd);
        });
      }

      function formatKb(kb) {
        return kb > 1024 ? `${(kb / 1024).toFixed(1)} MB` : `${Math.round(kb)} KB`;
      }

      function draw(snapshot) {
        const runtime = snapshot.runtime || {};
        const sync = runtime.roamDbSync || {};
        const saves = runtime.saveWrites || {};
        const copilot = runtime.copilot || {};
        const lookup = runtime.roamLookup || {};
        const power = snapshot.power || {};
        $("sample").textContent = `Sample ${time(snapshot.sampledAt)}. Monitoring stops when this window closes.`;
        pairs($("runtime"), [
          ["Roam DB sync", sync.inFlight ? "In flight" : sync.queued ? `Queued, ${sync.changedFiles} changed file(s)` : "Idle"],
          ["Save writes", `${saves.queuedFiles || 0} queued file(s)`],
          ["Copilot", `${copilot.started ? copilot.status : "Not started"}${copilot.busy ? ", busy" : ""}`],
          ["RoamLookup", `${lookup.started ? lookup.status : "Not started"}${lookup.busy ? ", busy" : ""}`],
        ]);
        pairs($("power"), [
          ["Thermal", power.thermalState || "Unavailable"],
          ["Speed limit", power.speedLimit == null ? "Unavailable" : `${power.speedLimit}%`],
          ["Idle", power.idle ? `${power.idle.state}, ${power.idle.seconds} s` : "Unavailable"],
        ]);
        rows($("metrics"), power.metrics || [], (metric) => {
          const tr = document.createElement("tr");
          tr.append(
            cell(metric.type),
            cell(String(metric.pid)),
            cell(`${metric.cpu.toFixed(1)}%`),
            cell(formatKb(metric.memoryKb)),
          );
          return tr;
        }, "No process metrics");
        rows($("power-events"), power.events || [], (event) => {
          const tr = document.createElement("tr");
          tr.append(cell(time(event.at)), cell(event.name), cell(event.state || String(event.limit || "")));
          return tr;
        }, "No power events");
        rows($("tasks"), snapshot.tasks || [], (task) => {
          const tr = document.createElement("tr");
          tr.append(
            cell(task.state, task.state.replace(/\s+/g, "-")),
            cell(task.message ? `${task.name}: ${task.message}` : task.name),
            cell(time(task.startedAt)),
            cell(duration(task, snapshot.sampledAt)),
          );
          return tr;
        }, "No tracked IPC tasks since panel opened");
        const logs = $("logs");
        logs.replaceChildren();
        if (!(snapshot.logs || []).length) {
          const empty = document.createElement("p");
          empty.className = "muted";
          empty.textContent = "No warn or error messages since panel opened.";
          logs.append(empty);
          return;
        }
        snapshot.logs.forEach((log) => {
          const row = document.createElement("article");
          const meta = document.createElement("div");
          const body = document.createElement("pre");
          meta.className = log.level;
          meta.textContent = `${time(log.at)} ${log.process} ${log.level}${log.source ? ` ${log.source}` : ""}`;
          body.textContent = log.message;
          row.append(meta, body);
          logs.append(row);
        });
      }

      $("close").addEventListener("click", () => window.AaronnoteDebug.close());
      window.AaronnoteDebug.onSnapshot(draw);
    </script>
  </body>
</html>
